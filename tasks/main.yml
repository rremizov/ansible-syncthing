---
- name: Install dependencies
  apt:
    name: "{{ packages }}"
    update_cache: true
  vars:
    packages:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg2
      - software-properties-common

- name: Ensure apt keyrings directory exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Add Syncthing GPG key
  get_url:
    url: "{{ syncthing_apt_key_url }}"
    dest: /etc/apt/keyrings/syncthing.asc
    mode: '0644'
    force: true

- name: Add Syncthing repository
  apt_repository:
    repo: "{{ syncthing_apt_repository }}"
    state: present

- name: Install Syncthing
  apt:
    name: syncthing
    state: present
  notify:
    - systemctl daemon-reload

- name: Flush handlers
  meta: flush_handlers

- name: Enable and start Syncthing instances
  systemd: name=syncthing@{{ item }} enabled=yes state=started
  with_items: "{{ syncthing_users }}"

- name: Allow Syncthing traffic
  ufw:
    rule: allow
    name: syncthing
    comment: Syncthing
    state: "{{ syncthing_ufw_rule_state }}"
  when: syncthing_create_ufw_rule
